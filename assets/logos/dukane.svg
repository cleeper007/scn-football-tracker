<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 168" role="img" aria-label="DuKane Conference, est. 2018">
  <title>DuKane Conference</title>
  <!-- shield -->
  <path d="M6 8 H144 V96 C144 128 112 150 75 162 C38 150 6 128 6 96 Z"
        fill="#12294c" stroke="#e8edf5" stroke-width="5" stroke-linejoin="round"/>
  <path d="M17 19 H133 V95 C133 122 106 141 75 151 C44 141 17 122 17 95 Z"
        fill="none" stroke="#7fa8dd" stroke-width="2" opacity=".55"/>

  <!-- eight stars, one per member school -->
  <defs>
    <path id="s" d="M0 -5.2 L1.5 -1.6 L5.2 -1.6 L2.2 .8 L3.4 4.6 L0 2.3 L-3.4 4.6 L-2.2 .8 L-5.2 -1.6 L-1.5 -1.6 Z"/>
  </defs>
  <g fill="#c9d9f0">
    <use href="#s" x="30" y="38"/>
    <use href="#s" x="45" y="34"/>
    <use href="#s" x="60" y="32"/>
    <use href="#s" x="75" y="31"/>
    <use href="#s" x="90" y="32"/>
    <use href="#s" x="105" y="34"/>
    <use href="#s" x="120" y="38"/>
    <use href="#s" x="75" y="46"/>
  </g>

  <text x="75" y="86" text-anchor="middle" textLength="112" lengthAdjust="spacingAndGlyphs"
        font-family="Impact, Haettenschweiler, 'Arial Narrow', 'Arial Black', sans-serif"
        font-size="34" fill="#ffffff" letter-spacing="1">DUKANE</text>
  <text x="75" y="106" text-anchor="middle" textLength="96" lengthAdjust="spacingAndGlyphs"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="600" fill="#9fc0e8" letter-spacing="2">CONFERENCE</text>

  <!-- est. banner -->
  <rect x="40" y="118" width="70" height="19" rx="3" fill="#1d3f70" stroke="#7fa8dd" stroke-width="1.5"/>
  <text x="75" y="131" text-anchor="middle"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="700" fill="#dbe7f7" letter-spacing="1">EST. 2018</text>
</svg>
